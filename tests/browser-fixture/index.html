<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>框架宿主验证</title>
<style>
body { margin: 0; background: #f5f6f8; color: #202833; font: 16px/1.6 system-ui, sans-serif; }
main { max-width: 900px; margin: 48px auto; padding: 0 24px; }
h1 { font-size: 24px; margin: 0 0 24px; } h2 { font-size: 18px; margin: 0; }
.instances { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.instance { background: white; border: 1px solid #d6dce4; padding: 20px; border-radius: 8px; }
.head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.head p { margin: 0; } .resources { font-size: 14px; color: #5b6675; margin: 8px 0 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-size: 14px; border: 1px solid #b4bfcd; background: white; color: #253246; padding: 7px 12px; border-radius: 5px; cursor: pointer; }
button:hover:not(:disabled) { background: #eaf1fa; border-color: #4475ac; }
button:focus-visible { outline: 3px solid #6c9bdb; outline-offset: 2px; }
button:disabled { color: #7c8490; background: #f3f4f6; cursor: default; }
.target { margin-top: 20px; min-height: 48px; border-top: 1px solid #e1e5eb; padding-top: 16px; }
.presenter { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
@media (max-width: 660px) { main { margin: 24px auto; } .instances { grid-template-columns: 1fr; } }
</style></head>
<body><main><h1>浏览器宿主验证</h1><div class="instances">
<section class="instance" aria-label="实例 A"><div class="head"><h2>实例 A</h2><p role="status">未启动</p></div><p class="resources"></p>
<div class="actions"><button data-action="start">启动</button><button data-action="stop">停止</button><button data-action="reject">能力拒绝</button><button data-action="failure">挂载失败</button><button data-action="partial">中途失败</button></div><div class="target"></div></section>
<section class="instance" aria-label="实例 B"><div class="head"><h2>实例 B</h2><p role="status">未启动</p></div><p class="resources"></p>
<div class="actions"><button data-action="start">启动</button><button data-action="stop">停止</button><button data-action="reject">能力拒绝</button><button data-action="failure">挂载失败</button><button data-action="partial">中途失败</button></div><div class="target"></div></section>
</div></main><script type="module" src="/app.js"></script></body></html>
